services:
  # ====================================================================
  # Database Service: MySQL 8.0 with Persistent Volume & Auto-Init
  # ====================================================================
  db:
    image: mysql:8.0
    container_name: tgh_hr_mysql
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-TghRootSecure2026!}
      MYSQL_DATABASE: ${DB_NAME:-hr_analytics}
      MYSQL_USER: ${DB_USER:-tgh_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-TghUserPass2026!}
    volumes:
      - tgh_mysql_data:/var/lib/mysql
      - ./init-db:/docker-entrypoint-initdb.d
    ports:
      # Optional external port mapping (default: 3307 to avoid host 3306 conflicts)
      - "${DB_EXTERNAL_PORT:-3307}:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-TghRootSecure2026!}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - tgh_hr_network

  # ====================================================================
  # Web Application Service: Express API + React Analytics Dashboard
  # ====================================================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tgh_hr_agent_ui
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-hr_analytics}
      DB_USER: ${DB_USER:-tgh_user}
      DB_PASSWORD: ${DB_PASSWORD:-TghUserPass2026!}
      COMPANY_DOMAIN: "@techygeekhub.com"
      N8N_WEBHOOK_URL: "https://n8n.srv1901759.hstgr.cloud/webhook/hr-agent-analytics-live"
    ports:
      # Map to desired VPS host port (default: 3000)
      - "${APP_PORT:-3000}:3000"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.hragent.entrypoints=web,websecure"
      - "traefik.http.routers.hragent.rule=Host(`${DOMAIN_NAME:-hr-agent.srv1901759.hstgr.cloud}`)"
      - "traefik.http.routers.hragent.tls=true"
      - "traefik.http.routers.hragent.tls.certresolver=mytlschallenge"
      - "traefik.http.services.hragent.loadbalancer.server.port=3000"
    networks:
      - tgh_hr_network

volumes:
  tgh_mysql_data:
    name: tgh_hr_mysql_data

networks:
  tgh_hr_network:
    name: tgh_hr_network
